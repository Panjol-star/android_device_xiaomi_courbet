name: Extract Proprietary Files

on:
  workflow_dispatch:
    inputs:
      device_tree_url:
        description: 'URL Device Tree (Wajib, cth: https://github.com/LineageOS/android_device_xiaomi_courbet)'
        required: true
        type: string
        default: 'https://github.com/Panjol-star/android_device_xiaomi_courbet.git' 
      branch:
        description: 'Branch Device Tree (Wajib, cth: lineage-20 / main)'
        required: true
        type: string
        default: 'lunaris-16.0'
      firmware_url:l
        description: 'URL Firmware / ROM (Wajib untuk ekstrak file)'
        required: true
        type: string
        default: 'https://bn.d.miui.com/V14.0.4.0.TKQMIXM/miui_COURBETGlobal_V14.0.4.0.TKQMIXM_43ae052f51_13.0.zip'

jobs:
  # ==========================================
  # JOB 1: Download & Cache Firmware
  # ==========================================
  download-firmware:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache Firmware Directory
        id: cache-firmware
        uses: actions/cache@v4
        with:
          path: firmware_cache
          key: firmware-${{ hashFiles('**/firmware_url') }}
          restore-keys: |
            firmware-

      - name: Download Firmware with aria2c
        if: steps.cache-firmware.outputs.cache-hit != 'true'
        run: |
          mkdir -p firmware_cache
          cd firmware_cache
          echo "Downloading firmware from: ${{ github.event.inputs.firmware_url }}"
          aria2c -x 16 -s 16 "${{ github.event.inputs.firmware_url }}"

      - name: Save Firmware to Artifact (Backup/Transfer)
        uses: actions/upload-artifact@v4
        with:
          name: firmware-file
          path: firmware_cache/

  # ==========================================
  # JOB 2: Extract Proprietary Files
  # ==========================================
  extract-files:
    needs: download-firmware
    runs-on: ubuntu-latest
    steps:
      - name: Maximize Build Disk Space
        uses: easydiff/maximize-build-space@master
        with:
          root-reserve-mb: 512
          swap-size-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install Required Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y brotli e2fsprogs clang aria2 zip unzip python3 python3-pip git

      - name: Setup Directory Structure
        run: |
          mkdir -p android/prebuilts/extract-tools/linux-x86/bin
          mkdir -p android/tools
          mkdir -p android/system
          mkdir -p android/device/xiaomi/courbet
          mkdir -p android/vendor/xiaomi/courbet

      - name: Clone LineageOS Extract Tools & Update Engine
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_extract-tools.git android/prebuilts/extract-tools
          git clone --depth=1 https://github.com/LineageOS/android_tools_extract-utils.git android/tools/extract-utils
          git clone --depth=1 https://github.com/LineageOS/android_system_update_engine.git android/system/update_engine

      - name: Link Brotli and Required Binaries
        run: |
          which brotli && ln -sf $(which brotli) android/prebuilts/extract-tools/linux-x86/bin/brotli || true
          which debugfs && ln -sf $(which debugfs) android/prebuilts/extract-tools/linux-x86/bin/debugfs || true
          which clang && ln -sf $(which clang) android/prebuilts/extract-tools/linux-x86/bin/clang || true

      - name: Clone Device Tree
        run: |
          git clone -b ${{ github.event.inputs.branch }} ${{ github.event.inputs.device_tree_url }} android/device/xiaomi/courbet

      - name: Restore Firmware from Cache
        uses: actions/cache@v4
        with:
          path: firmware_cache
          key: firmware-${{ github.event.inputs.firmware_url }}

      - name: Ensure Firmware is Available Locally
        run: |
          mkdir -p firmware_dir
          if [ -d "firmware_cache" ] && [ "$(ls -A firmware_cache)" ]; then
            cp -r firmware_cache/* firmware_dir/
          else
            cd firmware_dir
            aria2c -x 16 -s 16 "${{ github.event.inputs.firmware_url }}"
          fi

      - name: Execute Extract Files Script
        run: |
          cd android/device/xiaomi/courbet
          # Menyesuaikan eksekusi script extract-files.py
          if [ -f "extract-files.py" ]; then
            python3 extract-files.py || python3 extract-files.py ../../../firmware_dir/
          else
            echo "extract-files.py tidak ditemukan di root device tree!"
            exit 1
          fi

      - name: Zip Vendor Output and Upload Artifact
        run: |
          cd $GITHUB_WORKSPACE/android/vendor/xiaomi/courbet
          zip -r ../../../../extracted-vendor.zip .

      - name: Upload Artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: proprietary-vendor-courbet
          path: extracted-vendor.zip
          
